[project]
name = "deal_finder"
version = "0.1.0"
description = "deal_finder using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.7"
]

[project.scripts]
deal_finder = "deal_finder.main:run"
run_crew = "deal_finder.main:run"
train = "deal_finder.main:train"
replay = "deal_finder.main:replay"
test = "deal_finder.main:test"
run_with_trigger = "deal_finder.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
