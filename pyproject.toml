[project]
name = "deal_finder"
version = "0.1.0"
description = "Find genuine deals on mid-to-premium menswear in Australian shops"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "uvicorn>=0.30",
]

[project.scripts]
deal_finder = "deal_finder.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
