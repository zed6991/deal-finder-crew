[project]
name = "deal_finder"
version = "0.1.0"
description = "Find good deals on menswear with a crew of AI agents"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
deal_finder = "deal_finder.main:cli"
run_crew = "deal_finder.main:run"
train = "deal_finder.main:train"
replay = "deal_finder.main:replay"
test = "deal_finder.main:test"
run_with_trigger = "deal_finder.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
