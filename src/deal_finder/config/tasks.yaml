plan_task:
  description: >
    Style brief: "{brief}".
    Shopper sizes: {sizes}. Categories wanted: {categories}.
    Fabric rule: {fabric_rule}
    Extra notes: {notes}

    Plan 4 to 8 garments that together answer the brief and fit a total
    budget of {budget} {currency}. For each garment give the category,
    a specific garment name, fabric, colour, a fit note and a priority
    (1 = must have, 3 = nice to have).
    Write 2 or 3 shopping search queries per garment aimed at products on
    sale in {region_name}, e.g. "mens navy merino crew neck sale".
  expected_output: >
    A shopping plan of 4 to 8 garments, each with 2 or 3 search queries.
  agent: stylist

hunt_task:
  description: >
    For every garment in the plan, run its queries with shopping_search.
    Use web_search only when shopping results give no usable product.
    Collect up to 4 products per garment, preferring ones that show a sale
    or "was" price, priced in {currency}, sold by retailers in {region_name}.

    For each product record the category and garment it is for, its name,
    retailer, price, original price (only if the result shows one), currency,
    image link and URL.

    CRITICAL: copy every URL and image link character-for-character from
    the "link" and "imageUrl" fields of a tool result. Never shorten, guess
    or rebuild a link. Leave out any product you did not see in a result.
  expected_output: >
    A list of real products, up to 4 per garment, each with price and a
    verbatim URL.
  agent: deal_hunter
  context:
    - plan_task

verify_task:
  description: >
    Open each product with read_product_page, the most promising first,
    and at most 24 pages in all. From the page, fill in: the current price,
    the original price if the page shows the item is marked down, the
    currency, the fabric composition, whether it is in stock, and an image.
    Set verified to true only when the page confirmed the price. If a page
    will not load, keep the product with verified false and the search
    price. If the page redirected, keep the original URL.
    Drop products that the page shows are not menswear.
  expected_output: >
    The same list of products with prices, original prices, composition,
    stock and verified flags filled in from the product pages.
  agent: price_checker
  context:
    - hunt_task

assess_task:
  description: >
    Style brief: "{brief}". Budget: {budget} {currency}.
    Fabric rule: {fabric_rule}. Minimum discount wanted: {min_discount}%.

    For every checked product give a style_fit score from 0 to 10 for how
    well it suits the brief and works with the rest of the plan, and one
    plain sentence on why it is or is not a good buy. Mention the markdown
    when there is one. Use each product's URL exactly as given.
  expected_output: >
    One assessment per product: URL, style_fit (0-10) and a one-sentence
    justification.
  agent: curator
  context:
    - plan_task
    - verify_task
